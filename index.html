<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İndirim Hesaplama</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f8;
    display:flex;
    justify-content:center;
    padding:30px;
}

.box{
    width:340px;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

label{
    font-weight:bold;
    display:block;
    margin-top:12px;
    margin-bottom:6px;
}

.field{
    display:flex;
    gap:6px;
    align-items:center;
}

input, select{
    width:100%;
    height:42px;
    font-size:16px;
    text-align:center;
    border:1px solid #ccc;
    border-radius:8px;
}

input:focus, select:focus{
    outline:none;
    border:2px solid #57c785;
}

/* 🔵 CLEAR */
.clear{
    width:42px;
    height:42px;
    background:#3498db;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:8px;
    cursor:pointer;
    font-size:20px;
    font-weight:bold;
    transition:.15s;
    flex-shrink:0;
}

.clear:hover{ background:#2d85c1; }
.clear:active{ transform:scale(0.92); }

/* BUTTON ROW */
.button-row{
    display:flex;
    gap:10px;
    margin-top:15px;
}

/* HESAPLA */
.calc{
    flex:1;
    height:42px;
    background:#fff;
    color:#2c3e50;
    border:1.5px solid #c9d2dc;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

.calc.active{
    border-color:#8fd4ae;
    box-shadow:0 0 0 3px rgba(143,212,174,0.35);
}

/* RESET */
.reset{
    width:42px;
    height:42px;
    background:#fff;
    border:1.5px solid #c9d2dc;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
    transition:.15s;
}

.reset.active{
    border-color:#e74c3c;
    box-shadow:0 0 0 3px rgba(231,76,60,0.35);
}

/* İSKONTO SARI */
#indirim{
    background:#fff7a6;
}

/* RESULT */
.result{
    margin-top:15px;
    background:#ecfdf5;
    padding:12px;
    border-radius:8px;
    display:none;
}

.result p{
    margin:8px 0;
}

</style>
</head>

<body>

<div class="box">

<label>Tek Ürün Fiyatı</label>
<div class="field">
<input type="tel" id="fiyat">
<div class="clear" onclick="temizle('fiyat')">×</div>
</div>

<label>Adet</label>
<div class="field">
<input type="tel" id="adet">
<div class="clear" onclick="temizle('adet')">×</div>
</div>

<label>İskonto</label>
<select id="indirim">
    <option value="5">%5</option>
    <option value="10">%10</option>
</select>

<div class="button-row">

<button class="calc" id="hesaplaBtn" onclick="hesapla()">
Hesapla
</button>

<button class="reset" id="resetBtn" onclick="sifirla(event)">
↺
</button>

</div>

<div class="result" id="sonuc">

<p>Toplam: <b id="toplam"></b></p>

<p><b>İndirimli Toplam:</b> <b id="indirimli"></b></p>

<p>Oran: <b id="oran"></b></p>
<p>İndirimli Tek Fiyat: <b id="birim"></b></p>

</div>

</div>

<script>

const hesaplaBtn = document.getElementById("hesaplaBtn");
const resetBtn = document.getElementById("resetBtn");
const sonuc = document.getElementById("sonuc");

/* INPUT DEĞİŞİNCE RESET */
document.querySelectorAll("input, select").forEach(el=>{
    el.addEventListener("input", ()=>{
        hesaplaBtn.classList.remove("active");
        resetBtn.classList.remove("active");
        sonuc.style.display = "none";
    });

    el.addEventListener("change", ()=>{
        hesaplaBtn.classList.remove("active");
        resetBtn.classList.remove("active");
        sonuc.style.display = "none";
    });
});

/* CLEAR */
function temizle(id){
    document.getElementById(id).value = "";
    hesaplaBtn.classList.remove("active");
    resetBtn.classList.remove("active");
    sonuc.style.display = "none";
    setTimeout(()=>document.getElementById(id).focus(),0);
}

/* SAYI */
function sayiyaCevir(v){
    return parseFloat(v.replace(/\./g,"").replace(",", ".")) || 0;
}

/* HESAPLA */
function hesapla(){

    let fiyat = sayiyaCevir(document.getElementById("fiyat").value);
    let adet = sayiyaCevir(document.getElementById("adet").value);
    let oran = parseFloat(document.getElementById("indirim").value);

    if(!fiyat || !adet){
        alert("Eksik bilgi");
        return;
    }

    let toplam = fiyat * adet;
    let indirim = toplam * oran / 100;
    let sonucT = toplam - indirim;

    document.getElementById("toplam").innerText = toplam.toFixed(2);

    document.getElementById("indirimli").innerText = sonucT.toFixed(2);

    document.getElementById("oran").innerText =
        "%" + oran + " (" + indirim.toFixed(2) + " TL)";

    document.getElementById("birim").innerText =
        (sonucT / adet).toFixed(2) + " TL";

    sonuc.style.display = "block";
    hesaplaBtn.classList.add("active");
}

/* RESET */
function sifirla(e){

    e.preventDefault();

    document.querySelectorAll("input").forEach(i=>i.value="");
    document.getElementById("indirim").selectedIndex = 0;

    sonuc.style.display = "none";

    hesaplaBtn.classList.remove("active");

    resetBtn.classList.add("active");
}

/* ENTER NAVİGASYON (BUG FIX) */
const alanlar = Array.from(document.querySelectorAll("input, select"));

alanlar.forEach((el, i) => {
    el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();

            el.blur();

            let next = alanlar[i + 1];

            if (next) {
                setTimeout(() => {
                    next.focus();
                    if (next.tagName === "INPUT") next.select();
                }, 0);
            } else {
                hesapla();
            }
        }
    });
});

</script>

</body>
</html>
